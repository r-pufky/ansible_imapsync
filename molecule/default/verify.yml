---
###############################################################################
# Verify
###############################################################################

- name: 'Verify'
  hosts: 'all'
  gather_facts: false
  tasks:
    - name: 'Verify | import role variables'
      ansible.builtin.include_vars:
        file: '{{
            lookup("env", "MOLECULE_PROJECT_DIRECTORY") ~ "/vars/main.yml"
          }}'

    - name: '{{ "Verify | test | " ~ imapsync___app._bin }}'
      ansible.builtin.include_role:
        name: 'r_pufky.data.test'
        tasks_from: 'file.yml'
      vars:
        test_name: '{{ "Verify | test | " ~ imapsync___app._bin }}'
        test_file: '{{ imapsync___app._bin }}'
        test_owner: 'root'
        test_group: 'root'
        test_mode: '0755'
        test_state: 'file'
        test_diff: true

    - name: '{{ "Verify | test | validate " ~ imapsync___app._bin }}'
      ansible.builtin.command: '{{ imapsync___app._bin }}'
      register: test_imapsync_cmd
      changed_when: false
      failed_when: test_imapsync_cmd.rc != 0
